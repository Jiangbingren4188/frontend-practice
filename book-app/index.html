<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图书管理</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; }
    form input { margin-right: 6px; }
    li.done { text-decoration: line-through; color: #999; }
    .del { margin-left: 12px; cursor: pointer; }
    .tip { color: #c00; font-size: 14px; min-height: 20px; }
    .filters { margin: 12px 0; }
    .filters button { margin-right: 8px; }
  </style>
</head>
<body>
  <h1>图书管理</h1>
  <form id="add-form">
    <input type="text" id="book-name" placeholder="书名">
    <input type="text" id="book-author" placeholder="作者">
    <input type="number" id="book-rating" placeholder="评分" min="0" max="10" step="0.1">
    <button type="submit">添加</button>
  </form>
  <p class="tip" id="tip"></p>
  <ul id="book-list"></ul>
  <script src="app.js"></script>
</body>
</html>
